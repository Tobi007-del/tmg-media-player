<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TMG Media Player (Standalone)</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico" />
    <link rel="stylesheet" href="./css/Test.css" />
    <script>
      window.TMG_MEDIA_CSS_SRC = window.T007_INPUT_JS_SRC = window.T007_INPUT_CSS_SRC = window.T007_TOAST_JS_SRC = window.T007_TOAST_CSS_SRC = window.T007_DIALOG_JS_SRC = window.T007_DIALOG_CSS_SRC = Symbol.for("T007_VIRTUAL_RESOURCE");
      window.TMG_MEDIA_ALT_IMG_SRC = "/assets/icons/movie-tape.png";
    </script>
    <script type="module">
      import "@t007/toast";
      import "@t007/dialog";
      import "@t007/input";
      import "@t007/toast/style.css";
      import "@t007/dialog/style.css";
      import "@t007/input/style.css";
      import "sia-reactor/styles/time-travel-console.css";
    </script>
    <script type="module" src="./ts/super.ts"></script>
    <script defer src="./js/Test.js"></script>
  </head>
  <body>
    <div class="container">
      <h2>Single Media</h2>
      <video id="single" poster="../assets/images/justice-league-b.jpeg" tmgcontrols muted src="../assets/media/justice_league_preview.mp4" type="video/mp4" tmg--media--settings--metadata--title="Justice League Teaser" tmg--settings--control-panel--timeline--previews--address="../assets/images/previews/preview$.jpg" tmg--settings--control-panel--timeline--previews--spf="10" tmg--settings--overlay--behavior--value="auto" tmg--no-plug-list="," class="tmg-media">
        <track kind="captions" src="../assets/tracks/test-captions-ultimate.vtt" />
        <track default kind="subtitles" srclang="en" src="../assets/tracks/justice_league_preview.vtt" label="English" />
        <track kind="chapters" srclang="en" src="../assets/tracks/justice_league_chapters.vtt" label="English" />
      </video>
    </div>
    <div class="container">
      <h2>Ads Single Media</h2>
      <video id="adstest" muted tmg--settings--overlay--behavior--value="auto" class="tmg-media">
        <track default kind="subtitles" srclang="en" src="../assets/tracks/justice_league_preview.vtt" label="English" />
        <track kind="chapters" srclang="en" src="../assets/tracks/justice_league_chapters.vtt" label="English" />
      </video>
    </div>
    <div class="container">
      <h2>Media Playlist</h2>
      <video id="playlist" muted type="video/mp4" tmg--settings--overlay--behavior--value="auto" class="tmg-media"></video>
    </div>
    <div class="container">
      <h2>Dynamic Media Playlist</h2>
      <video id="dynalist" muted tmg--settings--overlay--behavior--value="auto" class="tmg-media"></video>
    </div>
  </body>
</html>
