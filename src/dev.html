<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TMG Media Player</title>
    <link rel="icon" type="image/x-icon" href="../favicon.ico" />
    <style>
      html {
        scroll-behavior: smooth;
        background-color: #141414;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --tmg-video-font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      body {
        margin: 0;
        min-height: 400vh;
      }
      .container {
        position: relative;
        padding-top: 50px;
        color: white;
      }
      .container > h2 {
        margin-top: 0;
        text-align: center;
      }
      /* VTT cue class styles — matched to parseVttText output: <c.red> → <span class="vtt-c red"> */
      .vtt-c.red {
        color: red;
      }
      .vtt-c.blue {
        color: blue;
      }
      .vtt-c.green {
        color: green;
      }
      .vtt-c.warning {
        color: yellow;
      }
      .vtt-c.bold {
        font-weight: bold;
      }
      .vtt-c.shadow {
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
      }
      .vtt-c.bg-yellow {
        background: rgba(255, 225, 0, var(--tmg-media-captions-background-opacity));
      }
      .vtt-c.highlight {
        background: rgba(255, 255, 255, var(--tmg-media-captions-background-opacity));
      }
      .vtt-c.rainbow {
        background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
    </style>
    <script>
      window.TMG_MEDIA_CSS_SRC = window.T007_INPUT_JS_SRC = window.T007_INPUT_CSS_SRC = window.T007_TOAST_JS_SRC = window.T007_TOAST_CSS_SRC = window.T007_DIALOG_JS_SRC = window.T007_DIALOG_CSS_SRC = Symbol.for("T007_VIRTUAL_RESOURCE");
      window.TMG_MEDIA_ALT_IMG_SRC = "/assets/icons/movie-tape.png";
    </script>
    <script type="module">
      import "@t007/toast";
      import "@t007/dialog";
      import "@t007/input";
      import "@t007/toast/style.css";
      import "@t007/dialog/style.css";
      import "@t007/input/style.css";
      import "sia-reactor/styles/time-travel-console.css";
    </script>
    <script type="module" src="./ts/super.ts"></script>
    <script defer src="./js/Test.js"></script>
  </head>
  <body>
    <div class="container">
      <h2>Single Media</h2>
      <video id="single" poster="../assets/images/justice-league-b.jpeg" tmgcontrols muted src="../assets/media/justice_league_preview.mp4" type="video/mp4" tmg--media--settings--metadata--title="Justice League Teaser" tmg--settings--control-panel--timeline--previews--address="../assets/images/previews/preview$.jpg" tmg--settings--control-panel--timeline--previews--spf="10" tmg--settings--overlay--behavior--value="auto" class="tmg-media">
        <track kind="captions" src="../assets/tracks/test-captions-ultimate.vtt" />
        <track default kind="subtitles" srclang="en" src="../assets/tracks/justice_league_preview.vtt" label="English" />
        <track kind="chapters" srclang="en" src="../assets/tracks/justice_league_chapters.vtt" label="English" />
      </video>
    </div>
    <div class="container">
      <h2>Media Playlist</h2>
      <video id="playlist" muted type="video/mp4" tmg--settings--overlay--behavior--value="auto" class="tmg-media"></video>
    </div>
    <div class="container">
      <h2>Dynamic Media Playlist</h2>
      <video id="dynalist" muted tmg--settings--overlay--behavior--value="auto" class="tmg-media"></video>
    </div>
  </body>
</html>
